<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zibra Digital</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#d9d9d9;color:#172744;font:14px Arial,sans-serif}
.app{max-width:1050px;margin:auto;padding:25px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-size:20px;font-weight:bold}.brand b{background:#f70000;color:#fff;padding:11px 14px;border-radius:10px;margin-right:8px}
.actions{display:flex;gap:8px}.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:bold;cursor:pointer}
.primary{background:#ff0000;color:#fff}.secondary{background:#fff;border:1px solid #dce3ee}
.layout{display:grid;grid-template-columns:1fr 380px;gap:20px}
.card{background:#fff;border:1px solid #e1e7f0;border-radius:14px;padding:23px}
h2{font-size:16px;margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}
input,textarea{width:100%;padding:10px;border:1px solid #d7dfeb;border-radius:8px;font:inherit}
textarea{min-height:62px;resize:vertical}.wide{grid-column:1/-1}
hr{border:0;border-top:1px solid #e5eaf2;margin:22px 0}
.item{display:grid;grid-template-columns:1fr 60px 100px 90px 30px;gap:8px;margin-bottom:8px}
.item input{padding:9px}.amount{text-align:right;padding-top:10px;font-weight:bold}
.delete{border:0;background:none;color:#c24b5c;font-size:20px;cursor:pointer}
.add{background:#edf2ff;color:#fc0000}.bottom{display:grid;grid-template-columns:1fr 210px;gap:15px;margin-top:17px;align-items:end}
.totals{background:#f6f8fc;border-radius:10px;padding:14px}.line{display:flex;justify-content:space-between;margin:8px 0;color:#64748b}
.line input{width:90px;border:0;background:transparent;text-align:right;padding:0;font-weight:bold}
.final{border-top:1px solid #dbe3ee;padding-top:10px;font-size:17px;font-weight:bold;color:#172744}
.preview{position:sticky;top:15px}.paper-head{
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #e4e9f1;
  padding-bottom:18px;
}
.logo-box{
  width: 120px;
  height: auto;
  border: 0;
  border-radius: 10px;
  display: grid;
  place-items: center;
  text-align: center;
  color: #60718e;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  overflow: hidden;
  flex: none;
}
.logo-box img{width:100%;height:100%;object-fit:contain}
.company{font-size:17px;font-weight:bold;flex:1}.company small,.meta span{display:block;color:#718099;font-size:11px;font-weight:normal;margin-top:4px}
.meta{text-align:right}.client{margin:20px 0}.client h3{margin:6px 0 2px}.client p{margin:0;white-space:pre-line;color:#718099}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:#f3f6fa;text-align:left;padding:8px;color:#718099}td{padding:9px;border-bottom:1px solid #edf1f5}th:last-child,td:last-child{text-align:right}
.summary{width:210px;margin:18px 0 20px auto}.summary div,.summary strong{display:flex;justify-content:space-between;margin:8px 0}.summary strong{border-top:2px solid #172744;padding-top:10px;font-size:16px}
.notes{border-top:1px solid #e4e9f1;padding-top:14px;color:#718099;font-size:11px}
@media(max-width:700px){
  body{padding-bottom:75px}.app{padding:0}.top{position:sticky;top:0;background:white;padding:13px 16px;margin:0;z-index:2}
  .layout{grid-template-columns:1fr}.card{border-radius:0;border-left:0;border-right:0}.preview{position:static;order:-1}
  .grid,.bottom{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr 30px;padding:10px;background:#f7f9fc;border-radius:10px}
  .item input:first-child{grid-column:1/-1}.amount{display:none}.delete{grid-column:3;grid-row:2}
  .top .actions{position:fixed;bottom:0;left:0;width:100%;padding:10px;background:white;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .btn{padding:12px 5px;font-size:12px}
}
@media print{.top,.form{display:none}.app{padding:0}.layout{display:block}.card{border:0}.preview{position:static}}
</style>
</head>

<body>
<main class="app">
  <header class="top">
    <div class="brand"><b>Z</b>Zibra Digital</div>
    <div class="actions">
      <button class="btn secondary" onclick="nuevaCotizacion()">Nueva</button>
      <button class="btn secondary" onclick="guardar()">Guardar</button>
      <button class="btn primary" onclick="window.print()">PDF</button>
    </div>
  </header>

  <section class="layout">
    <article class="card form">
      <h2>Nueva cotización</h2>

      <div class="grid">
        <div>
          <label>Número</label>
          <input id="numero" type="number" min="1" value="1">
        </div>
        <div>
          <label>Fecha</label>
          <input id="fecha" type="date">
        </div>
      </div>

      <hr>

      <h2>Cliente</h2>

      <div class="grid">
        <div>
          <label>Nombre o empresa</label>
          <input id="cliente" placeholder="Nombre del cliente">
        </div>
        <div>
          <label>Numero</label>
          <input id="telefono" placeholder="3026598745">
        </div>
        <div class="wide">
          <label>Dirrecion</label>
          <textarea id="contacto" placeholder="dirección"></textarea>
        </div>
      </div>

      <hr>

      <h2>Productos y servicios</h2>
      <div id="items"></div>
      <button class="btn add" onclick="agregarItem()">+ Añadir partida</button>

      <div class="bottom">
        <div>
          <label>Notas y condiciones</label>
          <textarea id="notas">Forma de pago: 50% de anticipo y 50% contra entrega.</textarea>
        </div>

        <div class="totals">
          <div class="line"><span>Subtotal</span><b id="subtotal">$0</b></div>
          <div class="line"><span>Descuento</span><span><input id="descuento" type="number" min="0" value="0"> COP</span></div>
          
          <div class="line final"><span>Total</span><b id="total">$0</b></div>
        </div>
      </div>
    </article>

    <aside class="card preview">
      <div class="paper-head">
        <label class="logo-box">
<div class="logo-box">
  <img src="zz.jpg" alt="Logo de la empresa">
</div>
        </label>

        <div class="company">
          ZIBRA DIGITAL
          <small>Convierte tus ideas en realidad<br>301-293-4630</small>
        </div>

        <div class="meta">
          <b>COTIZACIÓN</b>
          <span id="vistaNumero"></span>
          <span id="vistaFecha"></span>
        </div>
      </div>

      <div class="client">
        <small>PREPARADO PARA</small>
        <h3 id="vistaCliente">Nombre del cliente</h3>
        <p id="vistaContacto">Información de contacto</p>
        <p id="vistaTelefono"></p>
      </div>

      <table>
        <thead>
          <tr><th>Concepto</th><th>Cant.</th><th>Total</th></tr>
        </thead>
        <tbody id="vistaItems"></tbody>
      </table>

      <div class="summary">
        <div><span>Subtotal</span><span id="vistaSubtotal">$0</span></div>
        <div><span>Descuento</span><span id="vistaDescuento">$0</span></div>
        
        <strong><span>TOTAL</span><span id="vistaTotal">$0</span></strong>
      </div>

      <div class="notes">
        <b>CONDICIONES</b>
        <p id="vistaNotas"></p>
      </div>
    </aside>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let productos = [];

$('fecha').value = new Date().toISOString().slice(0, 10);

function dinero(valor) {
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: 'COP',
    maximumFractionDigits: 0
  }).format(valor || 0);
}

function agregarItem(nombre = '', cantidad = 1, precio = 0) {
  const producto = { nombre, cantidad, precio };
  productos.push(producto);

  const fila = document.createElement('div');
  fila.className = 'item';
  fila.innerHTML = `
    <input placeholder="Producto o servicio" value="${nombre}">
    <input type="number" min="0" value="${cantidad}">
    <input type="number" min="0" value="${precio}">
    <span class="amount"></span>
    <button class="delete">×</button>
  `;

  $('items').appendChild(fila);

  const inputs = fila.querySelectorAll('input');

  inputs[0].oninput = () => { producto.nombre = inputs[0].value; actualizar(); };
  inputs[1].oninput = () => { producto.cantidad = Number(inputs[1].value); actualizar(); };
  inputs[2].oninput = () => { producto.precio = Number(inputs[2].value); actualizar(); };

  fila.querySelector('.delete').onclick = () => {
    productos = productos.filter(p => p !== producto);
    fila.remove();
    actualizar();
  };

  actualizar();
}

function actualizar() {
  const subtotal = productos.reduce((s, p) => s + p.cantidad * p.precio, 0);
  const descuento = Math.min(
    Number($('descuento').value) || 0,
    subtotal
);
  const total = Math.max(0, subtotal - descuento);

  document.querySelectorAll('.item').forEach((fila, i) => {
    fila.querySelector('.amount').textContent =
      dinero(productos[i].cantidad * productos[i].precio);
  });

  $('subtotal').textContent = dinero(subtotal);
  $('total').textContent = dinero(total);
  

  $('vistaNumero').textContent = 'N.º ' + ($('numero').value || '—');
  $('vistaFecha').textContent = $('fecha').value;
  $('vistaCliente').textContent = $('cliente').value || 'Nombre del cliente';
  $('vistaContacto').textContent = $('contacto').value || 'Información de contacto';

  $('vistaItems').innerHTML = productos.map(p => `
    <tr>
      <td>${p.nombre || 'Sin descripción'}</td>
      <td>${p.cantidad}</td>
      <td>${dinero(p.cantidad * p.precio)}</td>
    </tr>
  `).join('');

  $('vistaSubtotal').textContent = dinero(subtotal);
  $('vistaDescuento').textContent = '- ' + dinero(descuento);
  $('vistaTotal').textContent = dinero(total);
  $('vistaNotas').textContent = $('notas').value;
}



function nuevaCotizacion() {
  $('numero').value = Number($('numero').value || 0) + 1;
  $('fecha').value = new Date().toISOString().slice(0, 10);
  $('cliente').value = '';
  $('correo').value = '';
  $('contacto').value = '';
  $('descuento').value = 0;

  $('notas').value = 'Forma de pago: 50% de anticipo y 50% contra entrega.';

  productos = [];
  $('items').innerHTML = '';
  agregarItem('Servicio profesional', 1, 0);
  actualizar();
}

function guardar() {
  const datos = {
    numero: $('numero').value,
    fecha: $('fecha').value,
    cliente: $('cliente').value,
    productos
  };

  localStorage.setItem('cotizacion_' + $('numero').value, JSON.stringify(datos));
  alert('Cotización guardada en este dispositivo.');
}

['numero','fecha','cliente','correo','contacto','notas','descuento']
  .forEach(id => $(id).addEventListener('input', actualizar));

function cargarLogoGuardado() {
  const logoGuardado = localStorage.getItem('logo_empresa');

  if (logoGuardado) {
    $('imagenLogo').src = logoGuardado;
    $('imagenLogo').hidden = false;
    $('textoLogo').hidden = true;
  }
}

$('logo').onchange = e => {
  const archivo = e.target.files[0];

  if (!archivo) return;

  const lector = new FileReader();

  lector.onload = () => {
    const imagen = lector.result;

    $('imagenLogo').src = imagen;
    $('imagenLogo').hidden = false;
    $('textoLogo').hidden = true;

    localStorage.setItem('logo_empresa', imagen);
  };

  lector.readAsDataURL(archivo);
};

cargarLogoGuardado();

agregarItem('Servicio profesional', 1, 850000);
agregarItem('Soporte mensual', 1, 120000);
actualizar();
</script>
</body>
</html>
